# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Auto-sync and build on project open (Android Studio)
# Android Studio automatically runs Gradle sync when opening a project.
# To auto-build APK on open, add to .idea/workspace.xml:
#   <property name="auto.build" value="true" />
org.gradle.configureondemand=true
